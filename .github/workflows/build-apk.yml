name: Build APK Without Manifest

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build Android App with Webview
        uses: Android-Actions/setup-android@v3

      - name: Generate APK with Cordova CLI
        run: |
          npm install -g cordova
          cordova create myApp com.cinematch.app CineMatch
          cd myApp
          cordova platform add android
          
          rm -rf www/*
          cp ../index.html www/index.html
          
          # 1080.gif dosyasını www klasörüne kopyala
          if [ -f "../1080.gif" ]; then
            cp ../1080.gif www/1080.gif
          fi

          # Icon Ayarları
          if [ -f "../filmikon.jpg" ]; then
            cp ../filmikon.jpg www/filmikon.jpg
            sed -i '/<\/widget>/i \    <icon src="www/filmikon.jpg" />' config.xml
          fi

          # Cordova Varsayılan Robot/Splash Görsellerini Doğrudan GIF ile Değiştirme
          find platforms/android/app/src/main/res/ -name "ic_cdv_splashscreen.png" -exec cp ../1080.gif {} \; || true
          find platforms/android/app/src/main/res/ -name "screen.png" -exec cp ../1080.gif {} \; || true

          cordova build android --debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CineMatch-APK
          path: myApp/platforms/android/app/build/outputs/apk/debug/*.apk
