name: Build APK Without Manifest

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build Android App with Webview
        uses: Android-Actions/setup-android@v3

      # Gradle sürümünü sabitleme
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      # Eksik olan Android Build-Tools 33.0.2 paketini yükleme
      - name: Install Android Build Tools
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "build-tools;33.0.2" "platforms;android-33"

      - name: Generate APK with Cordova CLI
        run: |
          npm install -g cordova
          cordova create myApp com.cinematch.app CineMatch
          cd myApp
          cordova platform add android@12.0.0
          
          rm -rf www/*
          cp ../index.html www/index.html
          
          # 1080.gif dosyasını www klasörüne kopyala
          if [ -f "../1080.gif" ]; then
            cp ../1080.gif www/1080.gif
          fi

          # Uygulama ikonunu ayarla
          if [ -f "../filmikon.jpg" ]; then
            cp ../filmikon.jpg www/filmikon.jpg
            sed -i '/<\/widget>/i \    <icon src="www/filmikon.jpg" />' config.xml
          fi

          # Cordova Splash Screen ve Arka Plan Rengi Ayarları
          sed -i '/<\/widget>/i \    <preference name="SplashScreen" value="none" />' config.xml
          sed -i '/<\/widget>/i \    <preference name="AutoHideSplashScreen" value="true" />' config.xml
          sed -i '/<\/widget>/i \    <preference name="AndroidWindowSplashScreenBackground" value="#0a0a12" />' config.xml

          # Robot ve varsayılan splash ikonlarını temizle
          find platforms/android/app/src/main/res/ -name "ic_cdv_splashscreen.*" -delete || true
          find platforms/android/app/src/main/res/ -name "screen.png" -delete || true

          cordova build android --debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CineMatch-APK
          path: myApp/platforms/android/app/build/outputs/apk/debug/*.apk
